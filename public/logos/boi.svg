<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <rect width="400" height="120" rx="12" fill="#FFFFFF"/>
  <!-- Bank of India Star Emblem -->
  <g transform="translate(25, 20)">
    <circle cx="40" cy="40" r="38" fill="#F37021"/>
    <!-- 5-pointed Star with person motif -->
    <polygon points="40,12 48,28 66,28 52,38 58,55 40,45 22,55 28,38 14,28 32,28" fill="#FFFFFF"/>
    <circle cx="40" cy="40" r="6" fill="#003399"/>
  </g>
  <!-- Text -->
  <text x="120" y="55" font-family="'IBM Plex Sans', sans-serif" font-size="28" font-weight="900" fill="#003399" letter-spacing="-0.5">Bank of India</text>
  <text x="122" y="80" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" fill="#F37021" letter-spacing="1">RELATIONSHIP BEYOND BANKING</text>
</svg>
