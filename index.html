<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon links -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanksCart: Compare Loan Interest Rates, Credit Cards & Apply Online</title>
    <meta data-rh="true" name="description" content="Compare and apply for personal loans, home loans, business loans, and credit cards from top Indian banks at BanksCart. Get instant eligibility and best interest rates." />
    <link rel="canonical" href="https://www.bankscart.com/" />
    
    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="BanksCart: Compare Loan Interest Rates, Credit Cards & Apply Online" />
    <meta property="og:description" content="Compare and apply for personal loans, home loans, business loans, and credit cards from top Indian banks at BanksCart. Get instant eligibility and best interest rates." />
    <meta property="og:url" content="https://www.bankscart.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.bankscart.com/favicon-32x32.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BanksCart: Compare Loan Interest Rates, Credit Cards & Apply Online" />
    <meta name="twitter:description" content="Compare and apply for personal loans, home loans, business loans, and credit cards from top Indian banks at BanksCart." />
    <meta name="twitter:image" content="https://www.bankscart.com/favicon-32x32.png" />

    <!-- Core Web Vitals: Preload High-Priority LCP Hero Banner -->
    <link rel="preload" as="image" href="/assets/hero-banner.webp" fetchpriority="high" type="image/webp" />

    <!-- Critical Above-The-Fold (ATF) CSS Inlined for Instant Paint & Zero CLS -->
    <style id="critical-atf-css">
      :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-display: swap; }
      body { margin: 0; padding: 0; background-color: #f8fafc; color: #1e293b; -webkit-font-smoothing: antialiased; }
      header { position: sticky; top: 0; z-index: 50; background: #ffffff; border-bottom: 1px solid #e2e8f0; height: 4rem; }
      .hero-banner-lcp { min-height: 460px; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); }
      h1 { font-size: clamp(1.875rem, 4vw, 3rem); line-height: 1.15; font-weight: 900; letter-spacing: -0.025em; margin: 0 0 1rem 0; color: #ffffff; }
      .aspect-logo { aspect-ratio: 160 / 36; width: 160px; height: 36px; }
      .aspect-bank-logo { aspect-ratio: 1 / 1; width: 48px; height: 48px; }
      .aspect-card { aspect-ratio: 5 / 3; width: 200px; height: 120px; }
      .table-skeleton { min-height: 420px; background-color: #ffffff; border-radius: 1rem; border: 1px solid #e2e8f0; }
    </style>

    <!-- Google Fonts Preconnect & Deferred Non-Critical Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap">
    </noscript>

    <!-- Site-Wide Organization & Brand Schema (Injected in Root Layout) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FinancialService",
      "name": "BanksCart",
      "legalName": "BanksCart Financial Services",
      "url": "https://www.bankscart.com/",
      "logo": "https://www.bankscart.com/assets/images/bankscart-logo.png",
      "description": "BanksCart is an online financial comparison platform in India helping consumers compare and apply for personal loans, home loans, business loans, credit cards, and credit score improvement services.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Connaught Place",
        "addressLocality": "New Delhi",
        "addressRegion": "Delhi",
        "postalCode": "110001",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-11-XXXXXXXX",
        "contactType": "Customer Support",
        "areaServed": "IN",
        "availableLanguage": ["English", "Hindi"]
      },
      "sameAs": [
        "https://www.facebook.com/bankscart",
        "https://twitter.com/bankscart",
        "https://www.linkedin.com/company/bankscart"
      ]
    }
    </script>

    <!-- Sitelinks Searchbox Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.bankscart.com/#website",
      "url": "https://www.bankscart.com/",
      "name": "BanksCart",
      "description": "Compare loan interest rates, credit cards, and apply online with instant eligibility check across top Indian banks.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://www.bankscart.com/financial-directory?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
